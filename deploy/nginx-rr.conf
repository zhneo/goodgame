    # REQUIREMENTS REVIEW (ai-requirements-validator)
    # Вставляется в server { listen 443 ssl; ... } стенда. Вне location (в server или http) также задайте:
    #     server_tokens off;   # не раскрывать версию nginx в заголовке Server и на страницах ошибок
    location = /rr { return 301 /rr/; }
    location /rr/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /rr;
        proxy_read_timeout 900;

        # Лимит 20 МБ проверяет приложение и отвечает понятным JSON; nginx пропускает чуть больше,
        # а на совсем большой файл отдаёт тот же формат вместо своей HTML-страницы.
        client_max_body_size 25M;
        error_page 413 = @rr_too_large;

        # Сжатие: app.js, styles.css и JSON-результаты уменьшаются в 3–5 раз.
        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json text/markdown text/plain image/svg+xml;

        # Заголовки безопасности (приложение ставит их само; здесь — на случай ответов самого nginx).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
    location @rr_too_large {
        default_type application/json;
        return 413 '{"code":"size","message":"Файл больше 20 МБ","hint":"Сохраните документ без изображений или разбейте его на части."}';
    }
